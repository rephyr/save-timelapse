[workspace]
members = ["viewer"]

[package]
name = "save-timelapse"
version = "0.1.0"
edition = "2021"
description = "Build a timelapse of a Factorio factory from existing save files"
license = "MIT"

[lib]
name = "save_timelapse"
path = "src/lib.rs"

[[bin]]
name = "save-timelapse"
path = "src/main.rs"

# Stands in for factorio.exe so the exporter can be developed and tested on a
# machine with no Factorio installed. See tests/fixtures/README.md.
[[bin]]
name = "fake-factorio"
path = "src/bin/fake_factorio.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
