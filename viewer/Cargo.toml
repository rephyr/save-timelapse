[package]
name = "viewer"
version = "0.5.1"
edition = "2021"
description = "Interactive pan/zoom/scrub viewer for save-timelapse frame sequences, with camera auto-follow"

[dependencies]
save-timelapse = { path = ".." }
macroquad = "0.4"
image = { version = "0.24.9", default-features = false, features = ["jpeg"] }

[dev-dependencies]
tempfile = "3"
