name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Build, test, and lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # macroquad/miniquad (the viewer crate) link against X11/GL/ALSA even
      # for a headless build+test run, so these need to be present before
      # cargo can produce a runnable test binary, not just to open a window.
      - name: Install viewer's native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Against rustfmt.toml, not rustfmt's defaults. The settings there
      # describe how this code is already written; the defaults would reformat
      # it into something narrower and harder to read for no benefit.
      - name: Formatting
        run: cargo fmt --all -- --check

  mod:
    name: Lua tests and syntax (mod/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 5.2 specifically, the version Factorio's modding API is, and NOT
      # whichever Lua is newest. This job used to install 5.3, which made it
      # green for the wrong reason: the suite passes under 5.1 through 5.5
      # alike, so a newer interpreter accepts syntax (`//`, `&`, `~`) and
      # library functions (`string.pack`, `math.type`) that Factorio will
      # refuse to run, and those are exactly what mod/encode.lua works around
      # by hand. A CI that cannot fail on the thing it exists to catch is
      # worse than no CI, because it is trusted.
      - name: Install Lua 5.2
        run: sudo apt-get update && sudo apt-get install -y lua5.2

      # Through the Makefile rather than calling the interpreter directly, so
      # CI runs what a developer runs. That also picks up `check-mod-syntax`,
      # which compiles every shipped Lua file. The unit suite now loads all of
      # them, so this is a narrower backstop than it was, but data.lua and
      # settings.lua run in the data stage and no test loads those: a syntax
      # error there would otherwise reach a player as "Factorio refuses to
      # load the mod".
      #
      # Deliberately its own job rather than folded into `cargo test`, whose
      # whole promise is needing nothing beyond the Rust toolchain.
      - name: Run the mod test suite
        run: make test-lua LUA=lua5.2
