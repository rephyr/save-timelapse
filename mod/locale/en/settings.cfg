[mod-setting-name]
save-timelapse-headless-scan=Headless export trigger
save-timelapse-include-resources=Include resource tiles
save-timelapse-capture-terrain=Capture surrounding terrain
save-timelapse-live-capture=Enable live capture
save-timelapse-snapshot-seconds=Periodic test-snapshot interval (seconds)

[mod-setting-description]
save-timelapse-headless-scan=Used internally by save-timelapse.exe's from-saves export flow to trigger a one-time export when Factorio is run headless. You shouldn't need to enable this yourself.
save-timelapse-include-resources=Also export ore and other resource tiles. Off by default: every ore tile is a separate entity, and they typically outnumber built entities while saying nothing about how the factory grew.
save-timelapse-capture-terrain=Include natural terrain (grass, water, sand, ...) and terrain scatter (trees, cliffs) in a margin around the base, so the factory shows real ground instead of floating in a void. Off by default: this can significantly increase export size and time (roughly 5x in testing).
save-timelapse-live-capture=Record construction events as you play, for a frame-by-frame timelapse. Takes one snapshot of the current save the first time it's turned on (the game will freeze briefly, proportional to base size), then logs only what changes afterward. View the result any time with save-timelapse.exe.
save-timelapse-snapshot-seconds=Takes a full snapshot of every surface on a repeating timer, independent of live capture. Mainly useful for testing the export path during real play; 0 disables it.
